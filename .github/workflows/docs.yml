name: Documentation
on:
    push:
        branches:
            - main
    pull_request:
    # Rollback, and any deploy of a ref other than the tip of main. See the
    # `publish_ref` input's use in the `deploy` job below.
    workflow_dispatch:
        inputs:
            publish_ref:
                description: 'Git ref (tag or branch) to build and deploy. Defaults to the tip of the default branch.'
                required: false
                type: string
permissions:
    contents: read
jobs:
    # Required PR gate: every extracted doc example is in sync with its source
    # (`docs:examples:check`), the content-state conformance table matches its
    # fixture index (`docs:content-state:check`), and every internal link in
    # every content document resolves (`links:check`). Runs on pull requests; the
    # deploy job below runs only on pushes to main and on a manual dispatch.
    #
    # The link check belongs beside the other two rather than in the url-contract
    # job that builds the whole tree: it reads the content documents directly and
    # needs no build.
    #
    # Skipped on the Changesets "Version Packages" PR (see the note in test.yml):
    # its diff is generated version bumps + CHANGELOG entries, which cannot break
    # the checks that already passed on the main it was cut from.
    build-check:
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: recursive

            - uses: pnpm/action-setup@v6
              with:
                  version: 11.15.1

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            # `pnpm docs:build` = doc-example sync check + content-state
            # conformance check.
            - name: Verify the documentation's generated content is in sync
              run: pnpm docs:build

            # Anchors are resolved against each heading's persisted slug, so a
            # retitled section does not turn this red.
            - name: Check every internal link resolves
              run: pnpm links:check

    # Required PR gate: the whole published tree is built and asserted against
    # `site-urls.json`, the committed manifest of the site's public URLs.
    #
    # One build emits the whole tree, so the tree this asserts is byte for byte
    # the tree the deploy job uploads. Nothing is restored and nothing is
    # assembled; there is no state carried between deploys for a gate to have to
    # reconstruct.
    #
    # This job builds the tree itself rather than reusing another job's output.
    # The duplicated build is a deliberate cost: a required gate that depends on
    # no other job cannot be skipped, starved or accidentally satisfied by a
    # stale artifact, and that independence is worth more here than the minutes
    # it costs.
    #
    # Unlike build-check, this job DOES run on the Changesets "Version Packages"
    # pull request. That PR is a version bump, and a release is exactly when the
    # site's promised URLs are most worth re-asserting.
    url-contract:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: recursive

            - uses: pnpm/action-setup@v6
              with:
                  version: 11.15.1

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - name: Build the whole tree
              run: pnpm build:all

            - name: Check the URL contract
              run: pnpm urls:check

    # Build the tree and upload it. There is nothing else: no storage branch, no
    # restore, no assembly, and so no state a deploy could carry forward or
    # corrupt. Two deploys of the same commit produce the same tree, and the ONLY
    # input is the ref.
    #
    # Rollback takes this same path. A `workflow_dispatch` with `publish_ref`
    # builds and deploys that ref — which is more trustworthy than force-pushing
    # a stored tree, because the thing that gets served is the thing this
    # repository says at that ref rather than a snapshot nothing re-derives.
    deploy:
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        # Queued, never cancelled: two deploys uploading the same Pages artifact
        # concurrently is the one race left, and a cancelled deploy would leave
        # the served tree describing neither ref.
        #
        # Job-level rather than workflow-level on purpose: a workflow-level group
        # would queue every pull request's `build-check` and `url-contract` gate
        # runs behind each other.
        concurrency:
            group: pages-deploy
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        permissions:
            # No `contents: write`. Nothing is pushed anywhere: Pages serves the
            # uploaded artifact and that is the whole of the published state.
            contents: read
            pages: write
            id-token: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/configure-pages@v6

            # `ref` is empty on a push, which checks out the pushed commit. On a
            # dispatch it is the ref to deploy — and an empty input falls back to
            # the same default, so a dispatch with no ref deploys the tip of the
            # default branch.
            - uses: actions/checkout@v7
              with:
                  submodules: recursive
                  ref: ${{ inputs.publish_ref }}

            - uses: pnpm/action-setup@v6
              with:
                  version: 11.15.1

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            # One application owns the whole published tree — the marketing
            # routes, the documentation, the playground, the bare viewer and the
            # consumer examples it carries — so every deploy builds all of it.
            #
            # The custom-domain file is part of this build and off by default;
            # set PUBLISH_CNAME=1 here once the domain resolves and is bound in
            # the repository's Pages settings. See
            # apps/site/scripts/finish-build.mjs for why it is not on yet.
            - name: Build the whole tree
              run: pnpm build:all

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: apps/site/build
            - uses: actions/deploy-pages@v5
              id: deployment

name: Documentation
on:
    push:
        branches:
            - main
    pull_request:
permissions:
    contents: read
jobs:
    # Required PR gate: the docs site builds with zero warnings and zero broken
    # internal links (`zensical build --strict`), every extracted doc example is
    # in sync with the Markdown (`docs:examples:check`), the content-state
    # conformance table matches its fixture index (`docs:content-state:check`),
    # and the published Cookbook recipe-support numbers match the catalog
    # (`docs:recipes:check`).
    # Runs on pull requests; the deploy job below runs only on pushes to main.
    #
    # Skipped on the Changesets "Version Packages" PR (see the note in test.yml):
    # its diff is generated version bumps + CHANGELOG entries, which cannot break
    # the docs build that already passed on the main it was cut from.
    build-check:
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
              with:
                  version: 11.15.1

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - uses: actions/setup-python@v7
              with:
                  python-version: 3.x

            - name: Install zensical
              run: pip install zensical

            # `pnpm docs:build` = doc-example sync check + content-state
            # conformance check + recipe-support sync check +
            # `zensical build --clean --strict` (warnings-as-failures +
            # internal link check).
            - name: Build docs (strict) + verify examples in sync
              run: pnpm docs:build

    # Required PR gate: the whole published tree is assembled and asserted
    # against `site-urls.json`, the committed manifest of the site's public URLs.
    #
    # Nothing else covers this. Each subtree is built by its own job and merged
    # into the `docs-site` storage branch, so the assembled tree does not exist
    # anywhere until the deploy job produces it — without this gate the first
    # time the site exists as a whole is the moment it is live. The previous
    # storage-branch tree is restored first, exactly as the deploy job does it,
    # so the assembly under test is the tree that would actually be served.
    #
    # This job builds the documentation site again rather than reusing
    # build-check's output. The duplicated build is a deliberate cost: a required
    # gate that depends on no other job cannot be skipped, starved or
    # accidentally satisfied by a stale artifact, and that independence is worth
    # more here than the minutes it costs.
    #
    # Unlike build-check, this job DOES run on the Changesets "Version Packages"
    # pull request. That PR is a version bump, and the version is what every
    # `{version}` URL in the manifest resolves to — a release is exactly when a
    # promised documentation URL changes meaning, so it is the last change to
    # exempt from the gate that polices those URLs.
    url-contract:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
              with:
                  version: 11.15.1

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - uses: actions/setup-python@v7
              with:
                  python-version: 3.x
            - name: Install zensical
              run: pip install zensical

            - name: Build Docs Assets
              run: pnpm build:all

            # Assigned on its own line rather than inlined into the `echo`
            # argument: `bash -e` does not fire on a failed command substitution
            # inside an argument, so an inlined form turns a crashed
            # docs-version.mjs into a silently empty `version` output.
            - name: Resolve docs version
              id: docsver
              run: |
                  set -euo pipefail
                  version="$(node scripts/docs-version.mjs)"
                  echo "version=${version}" >> "$GITHUB_OUTPUT"

            # The branch does not exist before the first deploy, and a tree built
            # from this checkout alone is a legitimate thing to assert against. A
            # restore that yields NOTHING from a branch that does exist is not:
            # the assembled tree would be missing every previously published
            # version directory and the gate would pass vacuously, blessing a
            # deploy that then force-pushes the same emptiness over the real
            # thing. Both halves matter: without `pipefail` the pipeline's exit
            # status is tar's alone, so a `git archive` that dies is reported as
            # a success whenever tar is happy with what it did receive; and a
            # valid archive of an empty tree extracts cleanly to nothing, which
            # no exit status can catch.
            - name: Restore previously published tree
              run: |
                  set -euo pipefail
                  rm -rf published && mkdir -p published
                  if git ls-remote --exit-code --heads origin docs-site >/dev/null 2>&1; then
                      git fetch --depth 1 origin docs-site
                      git archive FETCH_HEAD | tar -x -C published
                      if [ -z "$(ls -A published)" ]; then
                          echo "::error::The docs-site branch exists but restoring it produced an empty tree. Refusing to continue: the URL contract would pass vacuously against a tree missing every previously published documentation version." >&2
                          exit 1
                      fi
                  else
                      echo "docs-site does not exist yet; asserting against a tree assembled from this checkout alone."
                  fi

            - name: Assemble the full published tree
              run: node scripts/docs-publish.mjs --dest published --version "${{ steps.docsver.outputs.version }}"

            # `--version` rather than letting the script re-read package.json, so
            # the check asserts the same version the tree was assembled for.
            - name: Check the URL contract
              run: node scripts/url-contract.mjs --tree published --version "${{ steps.docsver.outputs.version }}"

            # The assembly that actually ships always passes `--only`, so a gate
            # that only ever assembles everything asserts a tree that never
            # ships. This re-runs the narrowest selection over the tree just
            # assembled — landing only, which needs no application build — and
            # asserts every other subtree came through byte-identical. That is
            # the epic's isolation guarantee, checked rather than claimed.
            - name: Prove subtree isolation under --only
              run: |
                  set -euo pipefail
                  rm -rf "${RUNNER_TEMP}/baseline"
                  cp -a published "${RUNNER_TEMP}/baseline"
                  node scripts/docs-publish.mjs --dest published --version "${{ steps.docsver.outputs.version }}" --only landing
                  for subtree in viewer demo docs; do
                      diff -r "${RUNNER_TEMP}/baseline/${subtree}" "published/${subtree}"
                  done
                  node scripts/url-contract.mjs --tree published --version "${{ steps.docsver.outputs.version }}"

    deploy:
        if: github.event_name == 'push'
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        permissions:
            # `contents: write` lets the job persist the accumulated, versioned
            # site to the durable `docs-site` storage branch (see below). This
            # branch is NOT the Pages source — Pages still serves the uploaded
            # artifact via `deploy-pages`.
            contents: write
            pages: write
            id-token: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/configure-pages@v6
            # Full history: the subtree classification below diffs this push's
            # range, and a shallow clone does not contain `github.event.before`.
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v6
              with:
                  version: 11.15.1

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            # Versioned documentation. Each release publishes into a
            # `/docs/<major.minor>/` subdirectory derived from the CORE
            # package.json version; previously published version directories are
            # IMMUTABLE and are preserved on every deploy. `docs-publish.mjs`
            # also builds the versioned site (correct canonical/site_url) and
            # maintains `versions.json`, the `/versions/` index and the `/latest/`
            # redirect. The site root is not a redirect: the landing page is
            # served there as a real document and carries its own canonical URL.
            #
            # The accumulated site is kept on the durable `docs-site` branch,
            # which is used only as storage — Pages continues to serve the
            # uploaded artifact, so the Pages source is unchanged.
            #
            # The version and the restored tree are resolved BEFORE the subtree
            # classification below, which reads both.
            #
            # `version` is assigned on its own line rather than inlined into the
            # `echo` argument: `bash -e` does not fire on a failed command
            # substitution inside an argument, so an inlined form would turn a
            # crashed docs-version.mjs into a silently empty output.
            - name: Resolve docs version
              id: docsver
              run: |
                  set -euo pipefail
                  version="$(node scripts/docs-version.mjs)"
                  echo "version=${version}" >> "$GITHUB_OUTPUT"

            # Restoring the whole previous tree is what makes per-subtree
            # ownership work: a subtree this push does not select is simply the
            # copy that is already here, carried forward untouched.
            #
            # It is also the only copy of every previously published version
            # directory, and a later step force-pushes this tree back over the
            # branch. So an empty restore from a branch that exists aborts HERE,
            # before anything is written into the tree and before anything is
            # pushed. Both halves matter: without `pipefail` the pipeline's exit
            # status is tar's alone, so a `git archive` that dies is reported as a
            # success whenever tar is happy with what it did receive; and a valid
            # archive of an empty tree extracts cleanly to nothing, which no exit
            # status can catch.
            - name: Restore previously published tree
              run: |
                  set -euo pipefail
                  rm -rf published && mkdir -p published
                  if git ls-remote --exit-code --heads origin docs-site >/dev/null 2>&1; then
                      git fetch --depth 1 origin docs-site
                      git archive FETCH_HEAD | tar -x -C published
                      if [ -z "$(ls -A published)" ]; then
                          echo "::error::The docs-site branch exists but restoring it produced an empty tree. Refusing to continue: publishing from here would force-push an empty tree over docs-site and delete every previously published documentation version." >&2
                          exit 1
                      fi
                  else
                      echo "docs-site does not exist yet; this deploy creates it."
                  fi

            # Subtree ownership: each subtree is rebuilt and rewritten only when
            # something it is derived from changed, so a documentation typo fix
            # leaves the published viewer and playground bytes untouched.
            #
            #   landing  apps/landing/**
            #   demo     apps/demo/**     or packages/**
            #   viewer   apps/viewer/**   or packages/**
            #   docs     docs/**, apps/examples/**, or a version directory the
            #            restored tree does not already hold
            #
            # Demo and viewer rebuild on ANY packages/** change, not only on
            # release: they consume the workspace build, and the playground is
            # the smoke test that the public entrypoints still work in a browser.
            #
            # Anything that does not classify — scripts/**, .github/**, root
            # config — publishes EVERY subtree. The isolation guarantee is
            # claimed only for the cases it is actually derived from; a change to
            # the publisher itself can affect any subtree, so it rebuilds all of
            # them. A diff that cannot be computed at all — force-push, first
            # commit, an absent `before` — publishes every subtree for the same
            # reason.
            #
            # A release is a docs trigger because the version it names has no
            # directory in the restored tree, which is true by construction
            # rather than by pattern-matching a path. The diff alone would not
            # say so: a version bump touches packages/core/package.json, which
            # classifies as `packages/**` — demo and viewer, never docs — so a
            # hotfix or manual bump crossing a minor would publish the
            # applications, never create /docs/<new minor>/, and regenerate
            # versions.json and /latest/ from a tree that does not contain it.
            #
            # `--no-renames` because a rename is otherwise reported at its
            # destination only: moving a file OUT of apps/landing/ would leave
            # the published landing page stale with nothing in the diff saying so.
            - name: Classify changed subtrees
              id: subtrees
              env:
                  BEFORE: ${{ github.event.before }}
                  AFTER: ${{ github.sha }}
                  VERSION: ${{ steps.docsver.outputs.version }}
              run: |
                  set -uo pipefail
                  all=0
                  if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                      all=1
                      changed=""
                  else
                      changed="$(git diff --no-renames --name-only "${BEFORE}" "${AFTER}")" || all=1
                  fi
                  landing=0; demo=0; viewer=0; docs=0
                  if [ "${all}" = "0" ]; then
                      while IFS= read -r f; do
                          [ -z "${f}" ] && continue
                          case "${f}" in
                              apps/landing/*) landing=1 ;;
                              apps/demo/*) demo=1 ;;
                              apps/viewer/*) viewer=1 ;;
                              packages/*) demo=1; viewer=1 ;;
                              docs/*|apps/examples/*) docs=1 ;;
                              *) all=1 ;;
                          esac
                      done <<EOF
                  ${changed}
                  EOF
                  fi
                  if [ "${all}" = "1" ]; then landing=1; demo=1; viewer=1; docs=1; fi
                  if [ ! -d "published/docs/${VERSION}" ]; then
                      echo "published/docs/${VERSION} is absent from the restored tree: publishing documentation for it."
                      docs=1
                  fi
                  only=""
                  if [ "${docs}" = "1" ]; then only="${only},docs,examples"; fi
                  if [ "${viewer}" = "1" ]; then only="${only},viewer"; fi
                  if [ "${demo}" = "1" ]; then only="${only},demo"; fi
                  if [ "${landing}" = "1" ]; then only="${only},landing"; fi
                  only="${only#,}"
                  echo "landing=${landing}" >> "$GITHUB_OUTPUT"
                  echo "demo=${demo}" >> "$GITHUB_OUTPUT"
                  echo "viewer=${viewer}" >> "$GITHUB_OUTPUT"
                  echo "docs=${docs}" >> "$GITHUB_OUTPUT"
                  echo "only=${only}" >> "$GITHUB_OUTPUT"
                  echo "Publishing subtrees: ${only}"

            # The packages are always built: every selected app consumes
            # `triiiceratops` and `@triiiceratops/plugin-*` through their
            # published entrypoints, so those `dist/` trees must exist before any
            # app build can resolve them on a clean checkout. The app builds
            # below are gated so an unselected subtree costs nothing.
            - name: Build packages
              run: pnpm build:packages

            - name: Build playground
              if: steps.subtrees.outputs.demo == '1'
              run: pnpm build:demo

            - name: Build bare viewer
              if: steps.subtrees.outputs.viewer == '1'
              run: pnpm build:viewer

            - name: Build example pages
              if: steps.subtrees.outputs.docs == '1'
              run: pnpm build:examples

            # Zensical is needed only to build the documentation version
            # directory, which is the subtree most pushes do not select.
            - uses: actions/setup-python@v7
              if: steps.subtrees.outputs.docs == '1'
              with:
                  python-version: 3.x
            - name: Install zensical
              if: steps.subtrees.outputs.docs == '1'
              run: pip install zensical

            - name: Publish the selected subtrees (preserving the rest)
              run: node scripts/docs-publish.mjs --dest published --version "${{ steps.docsver.outputs.version }}" --only "${{ steps.subtrees.outputs.only }}"

            - name: Persist accumulated versions to docs-site
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  cd published
                  git init -q -b docs-site
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git commit -q -m "docs: publish ${{ steps.docsver.outputs.version }} [skip ci]"
                  git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" docs-site
                  # Drop the storage .git so it is not shipped in the Pages artifact.
                  rm -rf .git

            # One artifact, one deploy, always the WHOLE tree: Pages serves a
            # single uploaded artifact, so there is no way to upload a subtree.
            # Per-subtree ownership governs what gets rebuilt and rewritten, not
            # how many deploys happen. Splitting this into parallel per-subtree
            # jobs would race the `docs-site` storage branch and drop whichever
            # subtree lost the push, so it is deliberately one sequential job.
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: published
            - uses: actions/deploy-pages@v5
              id: deployment

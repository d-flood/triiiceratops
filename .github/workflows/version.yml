# Version-preparation (the "prepare" half of the release; publishing is separate).
#
# On every push to main, Changesets maintains a "Version Packages" pull request
# that applies `changeset version` (rc bumps while in pre mode). Merging that PR
# lands a commit where every affected package version is ALREADY bumped (every
# publishable package, plus the paused annotation-editor plugin, which Changesets
# still versions even though it is no longer published) — required CI
# then packs correctly-versioned tarballs and publish.yml promotes those exact
# bytes. This is what keeps a build step out of publication: the version is baked
# in before CI ever packs.
#
# This workflow NEVER publishes. It only opens/updates the release PR, part of
# the full RC → soak → stable flow (which also exits pre mode for the stable
# release).
name: Version

on:
    push:
        branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: write
    pull-requests: write

jobs:
    version:
        name: Maintain the Version Packages PR
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v6
              with:
                  version: 11.15.1

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # `version` (no `publish`) => Changesets only opens/updates the release
            # PR. Publication is the separate, promotion-only publish.yml workflow.
            - name: Create or update the Version Packages PR
              uses: changesets/action@v1
              with:
                  version: pnpm changeset version
                  commit: 'chore: version packages'
                  title: 'chore: version packages'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Required CI.
#
# Every job carries `if: github.head_ref != 'changeset-release/main'`. That skips
# the whole suite on the Changesets "Version Packages" pull request, whose diff is
# entirely machine-generated (`package.json` version fields + CHANGELOG.md) on top
# of a main that this workflow already tested green on push, and whose identical
# tree is tested again on the push to main that merging it produces. That post-merge
# run is the one that matters: publish.yml promotes ITS packed tarballs. Testing the
# version PR cannot fail while the runs either side of it pass.
#
# `github.head_ref` is empty on `push`, so this never skips a main-branch run — only
# the one release PR. The condition is deliberately at JOB level, not workflow level:
# a job skipped by an `if` still REPORTS a (skipped) check that satisfies branch
# protection, whereas a workflow-level filter would report nothing and block the
# merge forever.
name: Run Tests

on:
    pull_request:
        branches: ['main']
    push:
        branches: ['main']

jobs:
    test:
        name: Run Unit Tests
        if: github.head_ref != 'changeset-release/main'
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
              with:
                  version: 11.15.1

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - name: Run Unit Tests
              run: pnpm --filter triiiceratops test run

    # Ticket 22: quality gates. Zero-warning lint + Svelte diagnostics, a
    # clean-build check (build:all must not dirty tracked files), and per-package
    # coverage floors that cannot silently decrease. Required.
    #
    # `build:all` runs first because `pnpm check` type-checks each package
    # against its dependencies' built `.d.ts` (the workspace is "type-checked
    # through the build"), and the coverage run imports the compiled paraglide +
    # generated modules produced by the build.
    quality:
        # Ticket 32: run the quality gates on every supported Node release (22
        # and 24) so a Node-version incompatibility in the build tooling surfaces
        # in CI. fail-fast disabled so a 22-only failure is visible next to 24.
        name: Quality Gates (lint, diagnostics, coverage, clean build) (Node ${{ matrix.node-version }})
        if: github.head_ref != 'changeset-release/main'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                node-version: [22, 24]

        steps:
            - uses: actions/checkout@v7
              with:
                  # Full history so the changed-lines coverage report (ticket 34)
                  # can resolve the merge-base with the PR base branch.
                  fetch-depth: 0

            - uses: pnpm/action-setup@v6
              with:
                  version: 11.15.1

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            # Build every package. This also proves the clean-build contract:
            # a clean generation/build must not modify any tracked file.
            - name: Build all packages
              run: pnpm build:all

            - name: Clean-build check (git status must be empty)
              run: |
                  if [ -n "$(git status --porcelain)" ]; then
                    echo "::error::build:all dirtied tracked files (generated output must be gitignored or deterministic):"
                    git status --porcelain
                    git diff
                    exit 1
                  fi
                  echo "Working tree clean after build:all."

            # Ticket 37: workspace-wide prettier gate. `format:check` runs
            # `prettier --check .` from the root over every non-generated source
            # file in all packages, scripts, and test-consumers (generated and
            # vendored paths are excluded via .prettierignore).
            - name: Format check (prettier)
              run: pnpm format:check

            # eslint --max-warnings 0 (blanket eslint-disable is itself a lint
            # error via local/no-blanket-eslint-disable).
            - name: Lint (zero warnings)
              run: pnpm lint

            # svelte-check --threshold warning across every package: any warning
            # fails. The only sanctioned exceptions are recorded in
            # lint-allowlist.md.
            - name: Svelte diagnostics + type check (zero warnings)
              run: pnpm check

            # Per-package v8 coverage, then compare against the committed floor.
            - name: Coverage
              run: pnpm test:coverage

            - name: Coverage floor (may not drop below coverage-baseline.json)
              run: pnpm coverage:check

            # Ticket 33: production-dependency audit gate. Runs a `--prod` audit
            # and maps each advisory onto the publishable package whose production
            # graph owns it; fails on any advisory at severity >= high. Dev-dep
            # advisories never reach this gate. Threshold + any exceptions live in
            # scripts/audit-prod.mjs, reviewed like lint-allowlist.md entries.
            - name: Production audit (fail on high+ prod advisories)
              run: pnpm audit:prod

            # Ticket 34: changed-lines coverage REPORT (never gates). On a PR,
            # intersect the diff against the merge-base with the target branch
            # and publish the per-package + total covered/instrumentable figure
            # to the job summary. Reporting only — the floor gate above is the
            # enforcement mechanism.
            - name: Changed-lines coverage report (PR only, job summary)
              if: github.event_name == 'pull_request'
              run: |
                  pnpm --silent coverage:changed -- --base "origin/${{ github.base_ref }}" \
                    | tee -a "$GITHUB_STEP_SUMMARY"

    # Ticket 24: browser E2E matrix. Sharded by Playwright project so the desktop
    # engines (chromium, firefox, webkit) and the mobile profiles (android-chrome,
    # mobile-webkit) run in parallel; each shard installs only the engine it needs.
    # Required (every shard must pass; fail-fast disabled so one engine's failure
    # does not mask the others).
    e2e:
        name: E2E (${{ matrix.project }})
        if: github.head_ref != 'changeset-release/main'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    - project: chromium
                      browser: chromium
                    - project: firefox
                      browser: firefox
                    - project: webkit
                      browser: webkit
                    - project: android-chrome
                      browser: chromium
                    - project: mobile-webkit
                      browser: webkit

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
              with:
                  version: 11.15.1

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - name: Install Playwright Browser
              run: pnpm --filter triiiceratops exec playwright install --with-deps ${{ matrix.browser }}

            # The Web Component parity spec loads the built element entries from
            # dist/ (served by the dev server), so build the library + element
            # before running the matrix. The dev server also serves Demo.svelte,
            # which imports the first-party plugin packages by name, so those
            # (and their plugin-sdk/ui peers) must be built too or Vite's dep
            # scan fails to resolve them.
            - name: Build library + Web Component + plugins
              run: |
                  pnpm --filter @triiiceratops/ui build
                  pnpm --filter triiiceratops build:lib
                  pnpm --filter triiiceratops build:element
                  pnpm --filter @triiiceratops/plugin-sdk build
                  pnpm --filter @triiiceratops/plugin-image-manipulation build
                  pnpm --filter @triiiceratops/plugin-image-export build
                  pnpm --filter @triiiceratops/plugin-pdf-export build
                  pnpm --filter @triiiceratops/plugin-annotation-editor build

            - name: Run E2E Tests
              run: pnpm --filter triiiceratops exec playwright test --project=${{ matrix.project }}

    accessibility:
        name: Accessibility (WCAG 2.2 AA)
        if: github.head_ref != 'changeset-release/main'
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
              with:
                  version: 11.15.1

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            # Per-theme AA contrast over the --tri-* token pairings (oklch,
            # computed). Fails on any pairing below AA.
            - name: Theme contrast check
              run: pnpm --filter triiiceratops test:contrast

            - name: Install Playwright Browsers
              run: pnpm --filter triiiceratops exec playwright install --with-deps chromium

            # The a11y spec drives the dev server's Demo.svelte, which imports
            # the first-party plugin packages by name, so they (and their
            # plugin-sdk/ui peers) must be built or Vite's dep scan fails to
            # resolve them.
            - name: Build library + plugins
              run: |
                  pnpm --filter @triiiceratops/ui build
                  pnpm --filter triiiceratops build:lib
                  pnpm --filter @triiiceratops/plugin-sdk build
                  pnpm --filter @triiiceratops/plugin-image-manipulation build
                  pnpm --filter @triiiceratops/plugin-image-export build
                  pnpm --filter @triiiceratops/plugin-pdf-export build
                  pnpm --filter @triiiceratops/plugin-annotation-editor build

            # Axe scans (states × themes), keyboard journeys, and reduced-motion,
            # scoped to the desktop chromium project.
            - name: Run accessibility E2E (axe + keyboard + reduced-motion)
              run: pnpm --filter triiiceratops exec playwright test a11y --project=chromium

    packed-consumers:
        # Ticket 32: install + build the packed tarballs on every supported Node
        # release (22 and 24) — tarball install/run is exactly where a Node
        # incompatibility in a shipped package would surface. fail-fast disabled
        # so a 22-only failure is visible next to 24.
        name: Packed Consumers (Node ${{ matrix.node-version }})
        if: github.head_ref != 'changeset-release/main'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                node-version: [22, 24]

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
              with:
                  version: 11.15.1

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            # The harness drives Chromium for most fixtures; the CSP fixtures
            # (ticket 24) also run on Firefox and WebKit, so all three engines are
            # installed here.
            - name: Install Playwright Browsers
              run: pnpm --filter triiiceratops exec playwright install --with-deps chromium firefox webkit

            # Packs real .tgz artifacts, installs them into clean fixtures via
            # BOTH npm and pnpm, builds each, and asserts against what a user
            # actually gets from npm.
            - name: Run packed-consumer harness
              run: pnpm test:packed

    # Ticket 25: performance comparison. Builds the PR base SHA and head SHA on
    # the SAME runner (same Node, same browser), measures per-artifact byte sizes
    # and browser runtime medians against the PACKED artifacts, and fails on a
    # deterministic size regression > 5% OR a runtime regression > 10% AND > 20ms
    # per scenario. It also enforces perf-budgets.json (committed absolute
    # ceilings), which fails even when base == head. Required; PR-only (needs a
    # base vs head to compare). Raw JSON + Playwright traces are uploaded.
    performance:
        name: Performance Comparison
        runs-on: ubuntu-latest
        # Headroom for the on-failure traced capture below, which builds base and
        # head a second time (the comparison removes its worktrees when it ends,
        # so there is nothing to reuse). Only a failing run pays it.
        timeout-minutes: 90
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'

        steps:
            - uses: actions/checkout@v7
              with:
                  # Full history so the base SHA is available for the worktree
                  # build the comparison performs.
                  fetch-depth: 0

            - uses: pnpm/action-setup@v6
              with:
                  version: 11.15.1

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            # The perf harness drives Chromium (software WebGL) against the packed
            # element + plugin IIFEs. Install the browser the measurement uses.
            - name: Install Playwright Browser
              run: pnpm --filter @triiiceratops/test-consumers exec playwright install --with-deps chromium

            # Build base + head in isolated worktrees and compare medians +
            # sizes; enforce the committed perf-budgets.json ceilings.
            #
            # `--no-traces` so the numbers this job enforces are the same KIND of
            # numbers `perf-budgets.json` holds. Playwright tracing with DOM
            # snapshots is not evenly distributed across the scenarios: measured
            # on this tree, `activate_image-manipulation` is 5.7 ms untraced and
            # 64.6 ms traced (a style install forces a snapshot), while
            # `first_canvas_render` barely moves. The budgets are captured
            # untraced — deliberately, so tracing overhead is not baked into a
            # ceiling — so gating a traced median against them fails on tracing
            # cost rather than on a regression. Traces are a debugging aid;
            # reproduce one locally by dropping this flag.
            #
            # This is no longer only a convention: `perf-budgets.json` records
            # the tracing mode it was captured in (`"tracing": "off"`) and
            # `compare.mjs` REFUSES to enforce those ceilings against a traced
            # run. Dropping `--no-traces` here now fails loudly with "tracing
            # mode mismatch" instead of failing as a phantom regression.
            - name: Run performance comparison
              run: pnpm perf:compare --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --no-traces

            # Losing the trace is the price of an honest verdict, and it is worst
            # exactly when a trace is wanted: the gating run above is untraced, so
            # a red perf job yields no trace to open. Capture one here, only after
            # the verdict is already in — a trace taken after the fact cannot
            # contaminate a ceiling, and `if: failure()` guarantees the ordering.
            #
            # `continue-on-error` because this step's own verdict is meaningless
            # by construction: it is traced, so the new tracing-mode gate rejects
            # its comparison against the untraced ceilings, and it must not be
            # able to turn a red job a different shade of red or a green one red.
            # Its output is the trace zip and the raw JSON, not a pass/fail. A
            # separate `--out-dir` under the same uploaded directory so it cannot
            # overwrite the report the verdict came from.
            - name: Capture traces for the failed comparison
              if: failure()
              continue-on-error: true
              run: pnpm perf:compare --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --out-dir perf-results/traced

            # Raw measurement JSON, downloadable from the run.
            - name: Upload performance artifacts
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: perf-results
                  path: perf-results/
                  if-no-files-found: warn

    # Ticket 21: machine-readable API snapshots + strict public types. Fails on
    # uncommitted snapshot drift, on any NEW `any` in public `.d.ts`, and — on a
    # PR — when a snapshot-touching change lacks a Changeset.
    api-report:
        name: API Snapshots + Strict Types
        if: github.head_ref != 'changeset-release/main'
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v7
              with:
                  # Full history so the Changeset guard can diff against the PR base.
                  fetch-depth: 0

            - uses: pnpm/action-setup@v6
              with:
                  version: 11.15.1

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            # Regenerate every API snapshot deterministically (builds the needed
            # `.d.ts` as a side effect).
            - name: Regenerate API snapshots
              run: pnpm api:report

            # Snapshot drift: a public-contract change that was not regenerated +
            # committed fails here (standard snapshot flow).
            - name: Fail on uncommitted snapshot drift
              run: git diff --exit-code

            # No `any` in public `.d.ts` output (allowlisted structural exceptions
            # only). A planted `any` on a public type fails here.
            - name: Assert no new `any` in public declarations
              run: pnpm api:check

            # A snapshot-touching PR must carry a Changeset (contract changes
            # require explicit review + versioning).
            - name: Require a Changeset for snapshot changes
              if: github.event_name == 'pull_request'
              run: |
                  BASE="origin/${{ github.base_ref }}"
                  SNAP_CHANGED=$(git diff --name-only "$BASE"...HEAD -- api-reports || true)
                  if [ -z "$SNAP_CHANGED" ]; then
                    echo "No API snapshot changes; Changeset not required."
                    exit 0
                  fi
                  echo "API snapshots changed in this PR:"
                  echo "$SNAP_CHANGED"
                  NEW_CHANGESETS=$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- '.changeset/*.md' \
                    | grep -viE '\.changeset/(README|config)' || true)
                  if [ -z "$NEW_CHANGESETS" ]; then
                    echo "::error::API snapshot(s) changed but no Changeset was added. Run 'pnpm changeset' to record the contract change."
                    exit 1
                  fi
                  echo "Changeset(s) present:"
                  echo "$NEW_CHANGESETS"

    # Ticket 27: release reproducibility (required CI). Two independent clean
    # builds of THIS SHA must produce byte-identical tarballs for every publishable
    # package (five today — `scripts/release/packages.mjs` is the list). This is
    # what lets publication PROMOTE verified artifacts instead of rebuilding — a
    # rebuild would land on the same bytes.
    # `npm pack` normalises mtimes + gzip headers, so there is no variable
    # metadata to exclude (documented in scripts/release/verify-reproducible.mjs).
    reproducibility:
        name: Release Reproducibility (deterministic tarballs)
        if: github.head_ref != 'changeset-release/main'
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
              with:
                  version: 11.15.1

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - name: Two clean builds must produce identical checksums
              run: pnpm release:reproducible

    # Ticket 27: release artifacts (required CI, PRODUCER half of the promotion
    # flow). Builds every package, packs one `.tgz` per publishable package (five
    # today), writes SHA256SUMS + release-manifest.json, and uploads them as a
    # workflow artifact. The publish
    # workflow downloads THIS artifact (matched by run id → commit SHA), verifies
    # the checksums, and runs `npm publish <tgz>` with no build of its own.
    release-artifacts:
        # Skipped on the Version Packages PR like every other job: the artifacts
        # that get promoted come from the push-to-main run after it merges (which
        # is the run carrying the bumped versions), never from the PR itself.
        name: Release Artifacts (pack + checksum)
        if: github.head_ref != 'changeset-release/main'
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
              with:
                  version: 11.15.1

            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            # build:all + npm pack every publishable package (five today; the paused
            # annotation-editor plugin is not one of them). Output goes to
            # RUNNER_TEMP so the tarballs never touch the tracked tree (keeps the
            # clean-build check below honest).
            - name: Build + pack the publishable packages
              run: pnpm release:pack --out "$RUNNER_TEMP/release-artifacts"

            # Prove the clean-build contract (ticket 22) still holds after packing:
            # building must not dirty any tracked file.
            - name: Clean-build check (git status must be empty)
              run: |
                  if [ -n "$(git status --porcelain)" ]; then
                    echo "::error::build/pack dirtied tracked files:"
                    git status --porcelain
                    exit 1
                  fi
                  echo "Working tree clean after build + pack."

            - name: Upload release tarballs
              uses: actions/upload-artifact@v7
              with:
                  name: release-tarballs
                  path: |
                      ${{ runner.temp }}/release-artifacts/*.tgz
                      ${{ runner.temp }}/release-artifacts/SHA256SUMS
                      ${{ runner.temp }}/release-artifacts/release-manifest.json
                  if-no-files-found: error
                  retention-days: 14

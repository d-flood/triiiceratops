# Release promotion pipeline.
#
# Publishing PROMOTES the exact tarballs required CI already built and verified —
# it never rebuilds. The required "Run Tests" workflow packs the six `.tgz` (with
# a SHA256SUMS manifest) and uploads them as a workflow artifact; this workflow
# downloads that SHA-matched artifact, re-verifies the checksums, and runs
# `npm publish <tgz>` per package. There is deliberately NO build/compile step
# here (see SPEC "Publishing promotes verified artifacts ... rather than
# rebuilding").
#
# Graph:  promote  →  registry smoke  →  GitHub release
# The GitHub release is created ONLY after the registry smoke test passes.
#
# Triggers:
#   · workflow_run — fires when "Run Tests" completes successfully on `main`;
#     promotes that run's artifacts (real publish, not a dry run).
#   · workflow_dispatch — operator points at a completed "Run Tests" run id and,
#     by default, does a `npm publish --dry-run` so the whole path can be proven
#     end-to-end without publishing (still no rebuild).
name: Release

on:
    workflow_run:
        workflows: ['Run Tests']
        types: [completed]
        branches: [main]
    workflow_dispatch:
        inputs:
            run_id:
                description: 'Run id of the "Run Tests" workflow whose artifacts to promote'
                required: true
                type: string
            dry_run:
                description: 'npm publish --dry-run (no real publish)'
                required: false
                default: true
                type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
    # The source CI run whose SHA-matched artifacts we promote.
    SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    # workflow_run promotions publish for real; workflow_dispatch defaults to a dry run.
    DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

jobs:
    promote:
        name: Promote verified artifacts to npm
        runs-on: ubuntu-latest
        # Only promote a SUCCESSFUL required-CI run on main (or a manual dispatch).
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'main')
        permissions:
            contents: read
            actions: read # download artifacts from the source CI run
            id-token: write # npm provenance / trusted publishing (OIDC)
        outputs:
            core_version: ${{ steps.publish.outputs.core_version }}
            published: ${{ steps.publish.outputs.published }}
        steps:
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'

            # npm >= 11.5.1 performs OIDC trusted publishing with `id-token: write`
            # and generates provenance from each tarball's publishConfig.provenance.
            - name: Update npm (OIDC + provenance capable)
              run: npm install -g npm@latest

            # Download the EXACT tarballs that required CI packed + verified for
            # this SHA. No workspace checkout, no install, no build.
            - name: Download release artifacts from the verified CI run
              uses: actions/download-artifact@v8
              with:
                  name: release-tarballs
                  path: release-artifacts
                  run-id: ${{ env.SOURCE_RUN_ID }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Verify tarball checksums (SHA match)
              working-directory: release-artifacts
              run: |
                  echo "Promoting artifacts from CI run ${SOURCE_RUN_ID} (SHA ${SOURCE_SHA})"
                  sha256sum -c SHA256SUMS
                  echo "All tarball checksums verified."

            - name: Publish each package (npm publish <tgz>, no rebuild)
              id: publish
              working-directory: release-artifacts
              run: |
                  set -euo pipefail
                  PUBLISHED=()
                  CORE_VERSION=""
                  # release-manifest.json (from pack-artifacts.mjs) lists the exact
                  # name/version/dist-tag/tarball for each of the six packages.
                  COUNT=$(node -p "require('./release-manifest.json').packages.length")
                  for i in $(seq 0 $((COUNT - 1))); do
                    NAME=$(node -p "require('./release-manifest.json').packages[$i].name")
                    VERSION=$(node -p "require('./release-manifest.json').packages[$i].version")
                    TAG=$(node -p "require('./release-manifest.json').packages[$i].distTag")
                    TGZ=$(node -p "require('./release-manifest.json').packages[$i].tarball")
                    if [ "$NAME" = "triiiceratops" ]; then CORE_VERSION="$VERSION"; fi

                    if [ "${DRY_RUN}" = "true" ]; then
                      echo "::group::[dry-run] npm publish $NAME@$VERSION (tag $TAG)"
                      npm publish "$TGZ" --access public --tag "$TAG" --dry-run
                      echo "::endgroup::"
                      continue
                    fi

                    # Idempotent: skip anything already on the registry so a
                    # re-run of a main CI success never errors on a duplicate.
                    if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
                      echo "$NAME@$VERSION already published — skipping."
                      continue
                    fi
                    # `--tag` comes from the manifest's distTag (see distTagFor):
                    # in pre mode that's `latest`, so bare installs track the newest
                    # rc. Trusted publishing sets the tag at publish time — there is
                    # deliberately no post-publish `npm dist-tag` (it needs a classic
                    # token OIDC trusted publishing doesn't grant).
                    echo "::group::npm publish $NAME@$VERSION (tag $TAG)"
                    npm publish "$TGZ" --access public --tag "$TAG"
                    echo "::endgroup::"
                    PUBLISHED+=("$NAME@$VERSION")
                  done
                  echo "core_version=$CORE_VERSION" >> "$GITHUB_OUTPUT"
                  if [ ${#PUBLISHED[@]} -gt 0 ]; then
                    echo "published=true" >> "$GITHUB_OUTPUT"
                    printf 'Published: %s\n' "${PUBLISHED[@]}"
                  else
                    echo "published=false" >> "$GITHUB_OUTPUT"
                    echo "Nothing new published (dry run or all versions already on registry)."
                  fi
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            # Hand the exact versions to the smoke + release jobs.
            - name: Re-upload release manifest for downstream jobs
              uses: actions/upload-artifact@v7
              with:
                  name: release-manifest
                  path: release-artifacts/release-manifest.json
                  retention-days: 7

    smoke:
        name: Registry smoke test (gates release)
        runs-on: ubuntu-latest
        needs: promote
        # Only smoke real publications (skip on dry run / nothing-published).
        if: needs.promote.outputs.published == 'true'
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  # Read-only checkout of the promoted commit for the smoke script.
                  # (No build — the script installs from the registry.)
                  ref: ${{ env.SOURCE_SHA }}
            - uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Download release manifest
              uses: actions/download-artifact@v8
              with:
                  name: release-manifest
                  path: .

            # npm's registry is eventually consistent; give a freshly published
            # version a moment to become installable before smoke-installing it.
            - name: Wait for registry propagation
              run: sleep 30

            - name: Install exact published versions + smoke assertions
              run: node scripts/release/smoke-registry.mjs --manifest release-manifest.json

    release:
        name: Create GitHub release
        runs-on: ubuntu-latest
        needs: [promote, smoke]
        # Gated on a PASSING registry smoke test.
        if: needs.promote.outputs.published == 'true'
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ env.SOURCE_SHA }}
            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: v${{ needs.promote.outputs.core_version }}
                  name: v${{ needs.promote.outputs.core_version }}
                  target_commitish: ${{ env.SOURCE_SHA }}
                  generate_release_notes: true
                  prerelease: ${{ contains(needs.promote.outputs.core_version, '-rc.') }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

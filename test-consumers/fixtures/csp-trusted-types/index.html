<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!--
            Trusted Types fixture (ticket 24, Chromium only — only Chromium
            enforces `require-trusted-types-for` today). Every DOM HTML sink must
            produce a TrustedHTML. Svelte renders every component via
            `<template>.innerHTML` and the viewer/plugins render trusted markup
            through `{@html}`, so core installs a pass-through **default** Trusted
            Types policy (utils/trustedTypes) at module load. Svelte creates its
            own `svelte-trusted-html` policy at module load too, unconditionally
            and with no opt-out. This page loads two bundles that each embed
            Svelte — the element IIFE and the plugin IIFE — so that name is
            created twice, which is why the directive below permits both names
            and `'allow-duplicates'`. Drop any one of the three and
            `createPolicy` throws.
        -->
        <meta
            http-equiv="Content-Security-Policy"
            content="require-trusted-types-for 'script'; trusted-types default svelte-trusted-html 'allow-duplicates'; default-src 'self'; script-src 'self' 'nonce-tri-csp-tt'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'"
        />
        <meta property="csp-nonce" content="tri-csp-tt" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>triiiceratops csp-trusted-types consumer</title>
        <script src="/node_modules/triiiceratops/dist/triiiceratops-element.iife.js"></script>
        <script src="/node_modules/@triiiceratops/plugin-image-manipulation/dist/iife.js"></script>
    </head>
    <body style="margin: 0">
        <triiiceratops-viewer
            id="v"
            manifest-id="/manifest.json"
            theme="dark"
            style="display: block; width: 100vw; height: 100vh"
        ></triiiceratops-viewer>
        <script nonce="tri-csp-tt">
            customElements.whenDefined('triiiceratops-viewer').then(() => {
                const viewer = document.getElementById('v');
                const plugin = window.Triiiceratops.plugins.get(
                    '@triiiceratops/plugin-image-manipulation',
                );
                viewer.plugins = [plugin];
            });
        </script>
    </body>
</html>

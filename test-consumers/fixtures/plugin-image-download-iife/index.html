<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>plugin-image-download-iife (core first)</title>
        <style>
            html,
            body {
                margin: 0;
            }
            triiiceratops-viewer {
                display: block;
                width: 100vw;
                height: 100vh;
            }
        </style>
        <!-- Script order A: core element IIFE FIRST, then the plugin IIFE. -->
        <script src="/node_modules/triiiceratops/dist/triiiceratops-element.iife.js"></script>
        <script src="/node_modules/@triiiceratops/plugin-image-download/dist/iife.js"></script>
    </head>
    <body>
        <triiiceratops-viewer
            manifest-id="/manifest.json"
        ></triiiceratops-viewer>
        <script>
            customElements.whenDefined('triiiceratops-viewer').then(() => {
                const viewer = document.querySelector('triiiceratops-viewer');
                // The plugin IIFE registered its factory into the shared
                // order-independent namespace; activation is explicit.
                const plugin = window.Triiiceratops.plugins.get(
                    '@triiiceratops/plugin-image-download',
                );
                viewer.plugins = [plugin];
            });
        </script>
    </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Triiiceratops — Web Component example</title>
        <link rel="stylesheet" href="app.css" />

        <script src="../../dist/triiiceratops-element.iife.js"></script>
        <!-- After core: AV reads core's runtime off `window.Triiiceratops`. -->
        <script src="../../dist/plugin-av/iife.js"></script>
    </head>
    <body>
        <triiiceratops-viewer
            id="images"
            theme="dark"
            manifest-id="https://iiif.wellcomecollection.org/presentation/v3/b18035723"
            canvas-id="https://iiif.wellcomecollection.org/presentation/b18035723/canvases/b18035723_0001.JP2"
        ></triiiceratops-viewer>

        <h2>Audio &amp; video</h2>
        <p>
            The IIIF Cookbook's
            <a
                href="https://iiif.io/api/cookbook/recipe/0003-mvm-video/manifest.json"
                >simplest video recipe</a
            >, played by <code>@triiiceratops/plugin-av</code> loaded from a
            script tag with no bundler.
        </p>
        <triiiceratops-viewer
            id="av"
            theme="dark"
            manifest-id="https://iiif.io/api/cookbook/recipe/0003-mvm-video/manifest.json"
        ></triiiceratops-viewer>

        <script>
            document.getElementById('av').plugins = [
                window.Triiiceratops.plugins.get('@triiiceratops/plugin-av'),
            ];
        </script>
    </body>
</html>

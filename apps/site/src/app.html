<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- Blocking so the stored scheme applies before first paint. -->
        <script>
            try {
                var chosen = localStorage.getItem('triiiceratops.theme');
                if (chosen === 'light' || chosen === 'dark') {
                    document.documentElement.setAttribute('data-theme', chosen);
                }
            } catch (error) {
                /* A blocked store means the machine preference wins. */
            }
        </script>
        <!-- Roman `latin` slice only (192 KB vs 419 KB full): first paint uses nothing else; `crossorigin` required even same-origin. -->
        <link
            rel="preload"
            href="/fonts/SourceSerif4Variable-Roman-Latin.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <script
            defer
            src="https://stats.dflood.org/script.js"
            data-website-id="014602e8-8f96-4f61-8fd7-02f323a5dfe7"
        ></script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>

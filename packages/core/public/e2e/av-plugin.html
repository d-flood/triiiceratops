<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Triiiceratops AV plugin fixture</title>
        <style>
            html,
            body {
                margin: 0;
            }
            #v {
                display: block;
                width: 800px;
                height: 600px;
            }
        </style>
    </head>
    <body>
        <triiiceratops-viewer id="v" theme="dark"></triiiceratops-viewer>
        <script type="module">
            /*
                The two BUILT artifacts a consumer loads, in the order a real
                page loads them: the core element IIFE, then
                `@triiiceratops/plugin-av`'s IIFE. Both must have been built
                (`pnpm build:all`); the plugin's whole `dist/` directory is
                served under `/plugin-av/` by the route the spec installs
                (`helpers/avPluginDist.ts`), since the plugin lives outside the
                dev server's root. The directory, not the one file: this
                plugin's entry fetches its waveform and hls.js chunks from
                beside its own script URL.

                The order is load-bearing for THIS plugin and no other. It is the
                one that does not bundle Svelte: it reads core's runtime off
                `window.Triiiceratops` as its very first statement, so core's
                script has to have run. That is why the plugin is injected from
                script here rather than written as a second `<script src>`: a
                classic script would run before a module one, whichever order
                they are written in.
            */
            await loadScript('/dist/triiiceratops-element.iife.js');
            await loadScript('/plugin-av/iife.js');

            // Record what the namespace actually carried, so a spec can tell
            // "the plugin never registered" apart from "the shared runtime was
            // missing" without reading a stack trace.
            window.__avRuntime = {
                hasSvelte:
                    typeof window.Triiiceratops?.svelte?.mount === 'function',
                internalKeys: Object.keys(
                    window.Triiiceratops?.svelteInternal ?? {},
                ),
            };

            const params = new URLSearchParams(location.search);
            const viewer = document.getElementById('v');
            // The plugin's panel starts open so the transcript is reachable
            // without driving the toolbar.
            viewer.config = {
                plugins: { av: { open: true } },
            };
            viewer.plugins = [
                window.Triiiceratops.plugins.get('@triiiceratops/plugin-av'),
            ];
            viewer.manifestId =
                params.get('manifest') ?? '/media/manifests/av-video.json';

            function loadScript(src) {
                return new Promise((resolve, reject) => {
                    const element = document.createElement('script');
                    element.src = src;
                    element.onload = resolve;
                    element.onerror = reject;
                    document.head.append(element);
                });
            }
        </script>
    </body>
</html>

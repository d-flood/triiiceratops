<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Triiiceratops WC IIFE parity fixture</title>
        <!--
            Self-contained IIFE Web Component entry (ticket 10). Loaded as a
            classic script from the built dist/ artifact; requires `pnpm
            build:element` (or build:all) to have run. Styles are self-installed
            into the shadow root, so no element stylesheet is needed.
        -->
        <script src="/dist/triiiceratops-element.iife.js"></script>
        <script>
            // The state bridge (ticket 02). Recorded from the document, before
            // the element is even parsed, because `viewerstateavailable` is
            // dispatched as soon as the inner viewer mounts — which, with the
            // IIFE entry already registered above, can happen before the
            // trailing body script runs. A composed event retargets to the
            // host, so `event.target` is the custom element itself.
            window.__viewerStateEvents = [];
            document.addEventListener('viewerstateavailable', (event) => {
                const host = event.target;
                window.__viewerStateEvents.push({
                    targetIsHost: host === document.getElementById('v'),
                    detailIsProperty: event.detail === host.viewerState,
                    bubbles: event.bubbles,
                    composed: event.composed,
                });
            });
        </script>
        <style>
            #v {
                display: block;
                width: 600px;
                height: 400px;
            }
        </style>
    </head>
    <body>
        <triiiceratops-viewer
            id="v"
            manifest-id="/demo-manifests/e2e/manifest.json"
            theme="dark"
        ></triiiceratops-viewer>
        <script>
            // Record documented Web Component behavior so the parity spec can
            // compare the IIFE and ESM entries head-to-head.
            window.__wcEntry = 'iife';
            window.__statechangeCount = 0;
            const v = document.getElementById('v');
            for (const name of [
                'manifestchange',
                'canvaschange',
                'choicechange',
                'statechange',
            ]) {
                v.addEventListener(name, () => {
                    window.__statechangeCount += 1;
                });
            }

            // Custom search as a property-only input, assigned as a JavaScript
            // property with no attribute involved.
            window.__searchCalls = [];
            v.searchProvider = async (query, context) => {
                window.__searchCalls.push({
                    query,
                    manifestId: context.manifestId,
                });
                return [
                    {
                        canvasIndex: 0,
                        canvasLabel: 'parity',
                        hits: [{ type: 'hit', match: query }],
                    },
                ];
            };
        </script>
    </body>
</html>

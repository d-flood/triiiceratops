<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Triiiceratops annotation-editor plugin fixture</title>
        <style>
            html,
            body {
                margin: 0;
            }
            #v {
                display: block;
                width: 800px;
                height: 600px;
            }
        </style>
    </head>
    <body>
        <triiiceratops-viewer id="v" theme="dark"></triiiceratops-viewer>
        <script type="module">
            /*
                The two BUILT artifacts a consumer loads: the core element IIFE,
                then the plugin's. Both must have been built (`pnpm build:all`,
                or `build:element` plus the plugin's own `pnpm build`); the
                plugin's whole `dist/` is served under
                `/plugin-annotation-editor/` by the route the spec installs
                (`helpers/annotationEditorDist.ts`), since the plugin lives
                outside the dev server's root.

                Script order is free for THIS plugin — it bundles its own Svelte
                runtime rather than reading core's off the namespace — but they
                are loaded in a consumer's order anyway so the fixture keeps
                telling the truth about how a page loads them.
            */
            await loadScript('/dist/triiiceratops-element.iife.js');
            await loadScript('/plugin-annotation-editor/iife.js');

            // Structured plugin failures are the only report an activation
            // problem makes (ADR 0010: plugin failures degrade silently in the
            // UI), so the fixture records them for the spec to read back.
            window.__pluginErrors = [];
            const viewer = document.getElementById('v');
            viewer.addEventListener('pluginerror', (event) => {
                window.__pluginErrors.push(event.detail);
            });

            const params = new URLSearchParams(location.search);
            // The panel starts open so its tools are reachable without driving
            // the toolbar, which is the AV fixture's convention too.
            viewer.config = {
                plugins: { 'annotation-editor': { open: true } },
            };
            viewer.plugins = [
                window.Triiiceratops.plugins.get(
                    '@triiiceratops/plugin-annotation-editor',
                ),
            ];
            viewer.manifestId =
                params.get('manifest') ??
                '/demo-manifests/static-image/manifest.json';

            function loadScript(src) {
                return new Promise((resolve, reject) => {
                    const element = document.createElement('script');
                    element.src = src;
                    element.onload = resolve;
                    element.onerror = reject;
                    document.head.append(element);
                });
            }
        </script>
    </body>
</html>

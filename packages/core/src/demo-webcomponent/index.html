<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Triiiceratops Web Component Demo</title>
        <link rel="stylesheet" href="app.css" />

        <!-- The custom element injects all its styles into its own shadow root,
             so no separate element stylesheet is needed. -->
        <script src="../../dist/triiiceratops-element.iife.js"></script>
        <!--
            `@triiiceratops/plugin-av`, from its own dist DIRECTORY — the entry
            fetches `av-hls.js`, `av-waveform.js`, `av-sequencer.js` and
            `av-transcript.js` from beside its own script URL, on demand.

            It must come AFTER core's script, and it is the one plugin of which
            that is true: it bundles no Svelte and reads core's runtime off
            `window.Triiiceratops`. Two classic scripts execute in source order,
            so writing it second is all the ordering this needs.
        -->
        <script src="../../dist/plugin-av/iife.js"></script>
    </head>
    <body>
        <triiiceratops-viewer
            id="images"
            theme="dark"
            manifest-id="https://iiif.wellcomecollection.org/presentation/v3/b18035723"
            canvas-id="https://iiif.wellcomecollection.org/presentation/b18035723/canvases/b18035723_0001.JP2"
        ></triiiceratops-viewer>

        <h2>Audio &amp; video</h2>
        <p>
            The IIIF Cookbook's
            <a
                href="https://iiif.io/api/cookbook/recipe/0003-mvm-video/manifest.json"
                >simplest video recipe</a
            >, played by <code>@triiiceratops/plugin-av</code> loaded from a
            script tag with no bundler.
        </p>
        <triiiceratops-viewer
            id="av"
            theme="dark"
            manifest-id="https://iiif.io/api/cookbook/recipe/0003-mvm-video/manifest.json"
        ></triiiceratops-viewer>

        <script>
            // Registration is explicit and per viewer: loading a plugin IIFE
            // only puts its factory in `window.Triiiceratops.plugins`. The
            // image viewer above deliberately gets none, so the two show core
            // alone and core-plus-plugin side by side.
            document.getElementById('av').plugins = [
                window.Triiiceratops.plugins.get('@triiiceratops/plugin-av'),
            ];
        </script>
    </body>
</html>

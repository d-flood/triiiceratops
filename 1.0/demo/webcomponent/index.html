<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Triiiceratops Web Component Demo</title>
        <link rel="stylesheet" href="app.css" />

        <!-- The custom element injects all its styles into its own shadow root,
             so no separate element stylesheet is needed. -->
        <script src="../../dist/triiiceratops-element.iife.js"></script>
    </head>
    <body>
        <triiiceratops-viewer
            theme="dark"
            manifest-id="https://iiif.wellcomecollection.org/presentation/v3/b18035723"
            canvas-id="https://iiif.wellcomecollection.org/presentation/b18035723/canvases/b18035723_0001.JP2"
        ></triiiceratops-viewer>

        <!--
            This core-only Web Component demo renders with no plugins. First-party
            plugins now ship as their own packages (e.g.
            `@triiiceratops/plugin-annotation-editor`). To use one here, load its
            IIFE and activate the factory it registers:

                const plugin = window.Triiiceratops.plugins.get(
                    '@triiiceratops/plugin-annotation-editor',
                );
                viewer.plugins = [plugin];
        -->
    </body>
</html>

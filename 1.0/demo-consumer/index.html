<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Triiiceratops Consumer Demo</title>
        <link rel="stylesheet" href="app.css" />

        <!-- Load the viewer (self-contained IIFE bundle with all dependencies) -->
        <script src="../dist/triiiceratops-element.iife.js"></script>
    </head>
    <body>
        <!-- The Viewer Component -->
        <triiiceratops-viewer
            theme="dark"
            manifest-id="https://iiif.wellcomecollection.org/presentation/v3/b18035723"
            canvas-id="https://iiif.wellcomecollection.org/presentation/b18035723/canvases/b18035723_0001.JP2"
        ></triiiceratops-viewer>

        <!--
            This core-only consumer demo renders the Web Component with no plugins.
            The annotation editor migrated to its own package
            (`@triiiceratops/plugin-annotation-editor`, ticket 17); to use it here,
            load that package's IIFE and activate it via `window.Triiiceratops.plugins`.
        -->
    </body>
</html>

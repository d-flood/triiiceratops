packages:
    - 'packages/*'
    # The site's applications: private, never published, and allowed to import a
    # package only through its published entrypoints. See eslint.boundaries.js.
    #
    # Two of them: the site, which owns the whole published tree — the marketing
    # routes, the playground at /demo/ and the bare viewer at /viewer/ — and the
    # framework consumer examples, which stay separate because one of them is
    # no-build by definition and making it a route would destroy what it proves.
    - 'apps/*'
    # The packed-consumer harness driver is a workspace tool (so `pnpm install`
    # provisions its devDeps, e.g. Playwright). Only the driver directory itself
    # is a workspace member — the fixtures under `test-consumers/fixtures/*` are
    # deliberately NOT workspace members: each consumes the packed `.tgz`
    # tarball, never workspace source.
    - 'test-consumers'

    # Uncial arrives as a git submodule and is a member for resolution and
    # building only: the site imports it and its build needs it packaged. It is
    # a separate repository with its own suites and its own releases, so the
    # root's recursive check/test/lint are filtered away from it (see the root
    # package.json) and its packages are in the changesets ignore list.
    #
    # Membership makes the submodule load bearing for `pnpm install` itself:
    # without it checked out there is no package named `uncial` and the install
    # fails outright. Every checkout that installs has to fetch it — hence
    # `submodules: recursive` in each workflow, and the submodule update the perf
    # comparison performs in the worktrees it builds.
    - 'vendor/uncial/packages/*'

    # Membership does NOT make the submodule a place to run pnpm from. It is a
    # pnpm workspace root in its own right, so a command with its cwd inside it
    # installs from Uncial's lockfile and ignores the `overrides` below — see
    # `scripts/assert-no-nested-store.mjs`, which gates `check` and `test` on the
    # absence of the store that leaves behind. Run the submodule's own suites
    # from here, with `pnpm check:uncial` / `pnpm test:uncial`.

allowBuilds:
    esbuild: true
    simple-git-hooks: true
    # uncial-cms-auth is a Cloudflare Worker; wrangler pulls workerd in.
    workerd: true

overrides:
    # Vitest accepts Vite 6 or 7 and would otherwise take the highest in the
    # tree, which Uncial's Vite 7 raised. Vitest's Vite is the one a project's
    # `vite.config.ts` is typed against, so it has to match the Vite the
    # project actually builds with.
    vitest>vite: '^6.0.0'
    # Same reason, one level out: uncial-cms's `createLocalVitePlugin` returns a
    # `Plugin` typed against its own Vite, and the site's `vite.config.ts` is
    # typed against the Vite it builds with. Two Vite majors in one tree make
    # those the same shape under different identities, which type-checks as an
    # error at the call site rather than at the version difference that caused it.
    uncial-cms>vite: '^6.0.0'
    lodash@>=4.0.0 <4.18.0: '>=4.18.0'
    qs@<6.15.2: '>=6.15.2'
    uuid@>=13.0.0 <13.0.1: ^13.0.1
    devalue@<5.6.4: '>=5.6.4'
